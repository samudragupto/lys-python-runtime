name: Common Lisp CI & Compilation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Common Lisp (SBCL) and Libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libpython3-dev

      - name: Install and Bootstrap Quicklisp
        run: |
          curl -O https://beta.quicklisp.org/quicklisp.lisp
          sbcl --noinform --non-interactive \
               --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(ql-util:without-prompting (ql:add-to-init-file))'
          # Link current repository into quicklisp local-projects
          mkdir -p ~/quicklisp/local-projects
          ln -s "$GITHUB_WORKSPACE" ~/quicklisp/local-projects/lys-python

      - name: Verify ASDF System Compilation and Loading
        run: |
          sbcl --noinform --non-interactive \
               --eval '(ql:quickload :lys-python)' \
               --eval '(format t "System :lys-python loaded successfully.~%")'

      - name: Run Test Suite
        run: |
          sbcl --noinform --non-interactive \
               --eval '(ql:quickload :lys-python)' \
               --eval '(asdf:test-system :lys-python)'

