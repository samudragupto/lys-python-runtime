name: Release Packaging & Verification

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Release Artifacts
        run: |
          echo "Packaging LYSPYTHON release for tag ${{ github.ref_name }}..."
          tar --exclude='.git' --exclude='.venv' -czvf lyspython-${{ github.ref_name }}.tar.gz .

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: lyspython-${{ github.ref_name }}.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
